<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Points Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cinzel', serif;
      text-align: center;
      background-color: #484848;
      color: #f0f0f0;
      padding: 20px;
    }
    .bar-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .house {
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent; /* Prevent Android/Chrome highlight */
    }
    .house img {
      width: 80px;
      margin-bottom: 10px;
    }
    .score {
      font-weight: bold;
      font-size: 24px;
      color: #f0f0f0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
    }
    .bar {
      width: 50px;
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      height: 300px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }
    .bar > div {
      position: absolute;
      bottom: 0;
      width: 100%;
      border-radius: 10px 10px 0 0;
    }
    #gryffindor-bar > div { background-color: #b01712; }
    #hufflepuff-bar > div { background-color: #c49a0c; } /* Slightly deeper yellow */
    #ravenclaw-bar > div { background-color: #015979; }
    #slytherin-bar > div { background-color: #10470d; }

    /* Controls layout */
    .controls {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      flex-wrap: wrap;
      width: 100%;
    }
    .house-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
    }
    .small-buttons {
      display: flex;
      gap: 5px;
    }
    .small-buttons button {
      flex: 1;
    }
    .wide-button {
      width: 100%;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      margin: 0;
      font-size: 16px;
      background-color: #333;
      color: #f0f0f0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #555; }
    #app, #leader-controls { display: none; }

    /* Reset button styling */
    #app #reset-button {
      display: none;
      width: 100%;
      margin-top: 40px;
    }
    #app #reset-button button {
      width: 100%;
      background-color: #B22222;
      padding: 12px;
      font-size: 18px;
      font-family: 'Cinzel', serif;
    }
    #app #reset-button button:hover {
      background-color: #8B1A1A;
    }

    /* Records button styling */
    #app #records-button {
      width: 100%;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    #app #records-button button {
      width: 100%;
      background-color: #333;
      padding: 12px;
      font-size: 18px;
      font-family: 'Cinzel', serif;
    }
    #app #records-button button:hover {
      background-color: #555;
    }

    /* Login screen styling */
    .login-screen { margin-top: 50px; }
    .login-screen button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      font-family: 'Cinzel', serif;
    }
    .or-text {
      display: inline;
      font-size: 14px;
      font-family: Arial, sans-serif;
      margin: 0 10px;
    }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-input {
      font-family: 'Cinzel', serif;
      background-color: #333;
      border: none;
      border-radius: 5px;
      color: #f0f0f0;
      padding: 10px;
      font-size: 18px;
      width: 200px;
      text-align: center;
    }
    .password-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    .login-arrow {
      font-size: 24px;
      background-color: #333;
      color: #f0f0f0;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      margin-left: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-arrow:hover { background-color: #555; }

    /* Modal styling */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-content {
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      max-width: 90%;
      position: relative;
      text-align: left;
    }
    #modal-content h2 {
      font-family: 'Cinzel', serif;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      font-size: 26px;
    }
    #modal-content h3 {
      font-family: 'Georgia', serif;
      font-size: 16px;
      margin: 5px 0 10px;
      text-transform: lowercase;
    }
    #modal-content h3 .head-name {
      font-family: 'Cinzel', serif;
      text-transform: capitalize;
      text-decoration: underline;
    }
    #modal-content ul {
      list-style-type: disc;
      padding-left: 20px;
      margin: 0;
    }
    #modal-content li {
      padding: 3px 0;
      font-family: 'Georgia', serif;
      font-size: 15px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
    }

    /* House colour variants with softened text */
    .gryffindor-modal { background-color: #b01712; color: #e0e0e0; }
    .gryffindor-modal h2 { color: #7a0f0b; }
    .hufflepuff-modal { background-color: #c49a0c; color: #e0e0e0; }
    .hufflepuff-modal h2 { color: #7f6509; }
    .ravenclaw-modal { background-color: #015979; color: #e0e0e0; }
    .ravenclaw-modal h2 { color: #01394d; }
    .slytherin-modal { background-color: #10470d; color: #e0e0e0; }
    .slytherin-modal h2 { color: #082c07; }
  </style>
  <script>
    const points = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };

    window.onload = function() {
      fetch('https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': '$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK' }
      })
      .then(r => r.json())
      .then(data => {
        points.gryffindor = data.record.houses.Gryffindor;
        points.hufflepuff = data.record.houses.Hufflepuff;
        points.ravenclaw = data.record.houses.Ravenclaw;
        points.slytherin = data.record.houses.Slytherin;
        updateBars();
      });

      document.addEventListener('keydown', e => {
        if (e.key === "Escape") closeModal();
      });
    };

    function updateBars() {
      const maxPoints = Math.max(points.gryffindor, points.hufflepuff, points.ravenclaw, points.slytherin);
      const maxBarHeight = 300;
      Object.keys(points).forEach(house => {
        const bar = document.getElementById(`${house}-bar`).firstElementChild;
        const score = document.getElementById(`${house}-score`);
        const height = maxPoints > 0 ? (points[house] / maxPoints) * maxBarHeight : 5;
        bar.style.height = height + 'px';
        score.textContent = points[house];
      });
    }

    function addPoints(house, pointsToAdd) {
      points[house] = Math.max(0, points[house] + pointsToAdd);
      updateBars();

      const btns = [
        'G-10','G+10','G+50',
        'H-10','H+10','H+50',
        'R-10','R+10','R+50',
        'S-10','S+10','S+50'
      ].map(id => document.getElementById(id));
      btns.forEach(b => b.disabled = true);

      let req = new XMLHttpRequest();
      req.onreadystatechange = () => {
        if (req.readyState == XMLHttpRequest.DONE) btns.forEach(b => b.disabled = false);
      };
      req.open("PUT", "https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d", true);
      req.setRequestHeader("Content-Type", "application/json");
      req.setRequestHeader("X-Master-Key", "$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK");
      req.send(JSON.stringify({ houses: {
        Gryffindor: points.gryffindor,
        Hufflepuff: points.hufflepuff,
        Ravenclaw: points.ravenclaw,
        Slytherin: points.slytherin
      }}));
    }

    function showStudentView() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
    function showLeaderLogin() {
      document.getElementById('leader-login').style.display = 'flex';
    }
    function checkPassword() {
      if (document.getElementById('password').value === 'Broom') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('leader-controls').style.display = 'flex';
        document.getElementById('reset-button').style.display = 'block';
        document.getElementById('records-button').style.display = 'block';
      } else {
        document.getElementById('error-message').style.display = 'block';
      }
    }
    function showResetConfirmation() {
      document.getElementById('reset-button').innerHTML = `<button onclick="resetPoints()">Are you Certain?</button>`;
    }
    function resetPoints() {
      points.gryffindor = points.hufflepuff = points.ravenclaw = points.slytherin = 0;
      updateBars();
      let req = new XMLHttpRequest();
      req.open("PUT", "https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d", true);
      req.setRequestHeader("Content-Type", "application/json");
      req.setRequestHeader("X-Master-Key", "$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK");
      req.send(JSON.stringify({ houses: { Gryffindor: 0, Hufflepuff: 0, Ravenclaw: 0, Slytherin: 0 } }));
      document.getElementById('reset-button').innerHTML = `<button onclick="showResetConfirmation()">Reset</button>`;
    }

    function showHouseMembers(house) {
      const members = {
        gryffindor: ["Emily Reynolds", "Matthew Harper", "Josh Harris", "Jade Lewis", "Mackenzie Alliston", "Emma Hunt"],
        hufflepuff: ["Paige Parkin", "Lois Lawes", "Sarah Hales", "Louis Kirby", "Sam Southcott", "Tadgh Daly"],
        ravenclaw: ["Amy Cornish", "Hayley Reynolds", "Cadance Agnew", "Oliver Clutterbuck", "Grace Fletcher", "Joe Brown"],
        slytherin: ["Nicola Foskett", "Yasmin Nixon", "Alison Wicks", "Rhys Foot", "Tim Balog", "India Watson"]
      };
      const heads = {
        gryffindor: "Zachary Roman",
        hufflepuff: "Aaron Wayne",
        ravenclaw: "Megan Miller",
        slytherin: "Laura Bultitude"
      };
      const modal = document.getElementById('modal-content');
      modal.className = '';
      modal.classList.add(`${house}-modal`);
      modal.innerHTML =
        `<button class="close-btn" onclick="closeModal()">×</button>
         <h2>${house.toUpperCase()}</h2>
         <h3>house head: <span class="head-name">${heads[house]}</span></h3>
         <ul>${members[house].map(n => `<li>${n}</li>`).join('')}</ul>`;
      document.getElementById('modal-overlay').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }
  </script>
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-options">
      <button onclick="showStudentView()">Student</button>
      <span class="or-text">or</span>
      <button onclick="showLeaderLogin()">House Head</button>
    </div>
    <div id="leader-login" class="password-container" style="display: none;">
      <input type="password" id="password" class="password-input" placeholder="Password">
      <button class="login-arrow" onclick="checkPassword()">→</button>
      <p id="error-message" style="color: red; display: none;">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <div class="bar-container">
      <div class="house" onclick="showHouseMembers('gryffindor')">
        <img src="https://i.imgur.com/yEJLaKM_d.webp" alt="Gryffindor Crest">
        <div class="score" id="gryffindor-score">0</div>
        <div class="bar" id="gryffindor-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('hufflepuff')">
        <img src="https://i.imgur.com/3fPEBby_d.webp" alt="Hufflepuff Crest">
        <div class="score" id="hufflepuff-score">0</div>
        <div class="bar" id="hufflepuff-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('ravenclaw')">
        <img src="https://i.imgur.com/q2ZDGMS_d.webp" alt="Ravenclaw Crest">
        <div class="score" id="ravenclaw-score">0</div>
        <div class="bar" id="ravenclaw-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('slytherin')">
        <img src="https://i.imgur.com/TqEV4ii_d.webp" alt="Slytherin Crest">
        <div class="score" id="slytherin-score">0</div>
        <div class="bar" id="slytherin-bar"><div></div></div>
      </div>
    </div>

    <!-- Leader Controls -->
    <div id="leader-controls" class="controls">
      <div class="house-controls">
        <div class="small-buttons">
          <button id="G-10" onclick="addPoints('gryffindor', -10)">-</button>
          <button id="G+10" onclick="addPoints('gryffindor', 10)">+</button>
        </div>
        <button id="G+50" class="wide-button" onclick="addPoints('gryffindor', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="H-10" onclick="addPoints('hufflepuff', -10)">-</button>
          <button id="H+10" onclick="addPoints('hufflepuff', 10)">+</button>
        </div>
        <button id="H+50" class="wide-button" onclick="addPoints('hufflepuff', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="R-10" onclick="addPoints('ravenclaw', -10)">-</button>
          <button id="R+10" onclick="addPoints('ravenclaw', 10)">+</button>
        </div>
        <button id="R+50" class="wide-button" onclick="addPoints('ravenclaw', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="S-10" onclick="addPoints('slytherin', -10)">-</button>
          <button id="S+10" onclick="addPoints('slytherin', 10)">+</button>
        </div>
        <button id="S+50" class="wide-button" onclick="addPoints('slytherin', 50)">+50</button>
      </div>
    </div>

    <!-- Reset -->
    <div id="reset-button">
      <button onclick="showResetConfirmation()">Reset</button>
    </div>

    <!-- Records -->
    <div id="records-button" style="display:none;">
      <button onclick="window.open('https://docs.google.com/spreadsheets/d/1107W9U3n14VCO089Yk_IMMMv5ttXcUIOYwNbyyqiowk/edit?usp=sharing', '_blank')">Records</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" onclick="closeModal()">
    <div id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

</body>
</html>
