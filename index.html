<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Points Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cinzel', serif;
      text-align: center;
      background-color: #484848;
      color: #f0f0f0;
      padding: 20px;
    }
    .bar-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .house {
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .house img {
      width: 80px;
      margin-bottom: 10px;
    }
    .score {
      font-weight: bold;
      font-size: 24px;
      color: #f0f0f0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
    }
    .bar {
      width: 50px;
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      height: 300px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }
    .bar > div {
      position: absolute;
      bottom: 0;
      width: 100%;
      border-radius: 10px 10px 0 0;
    }
    #gryffindor-bar > div { background-color: #b01712; }
    #hufflepuff-bar > div { background-color: #d8a90e; }
    #ravenclaw-bar > div { background-color: #015979; }
    #slytherin-bar > div { background-color: #10470d; }

    /* Controls layout */
    .controls {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      flex-wrap: wrap;
      width: 100%;
    }
    .house-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
    }
    .small-buttons {
      display: flex;
      gap: 5px;
    }
    .small-buttons button {
      flex: 1;
    }
    .wide-button {
      width: 100%;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      margin: 0;
      font-size: 16px;
      background-color: #333;
      color: #f0f0f0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #555; }
    #app, #leader-controls { display: none; }

    /* Reset button styling inside app only */
    #app #reset-button {
      display: none;
      margin-top: 40px;
      width: 100%;
    }
    #app #reset-button button {
      width: 100%;
      background-color: #B22222;
      padding: 12px;
      font-size: 18px;
      font-family: 'Cinzel', serif;
    }
    #app #reset-button button:hover {
      background-color: #8B1A1A;
    }

    /* Login screen styling */
    .login-screen { margin-top: 50px; }
    .login-screen button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      font-family: 'Cinzel', serif;
    }
    .or-text {
      display: inline;
      font-size: 14px;
      font-family: Arial, sans-serif;
      margin: 0 10px;
    }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-input {
      font-family: 'Cinzel', serif;
      background-color: #333;
      border: none;
      border-radius: 5px;
      color: #f0f0f0;
      padding: 10px;
      font-size: 18px;
      width: 200px;
      text-align: center;
    }
    .password-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    .login-arrow {
      font-size: 24px;
      background-color: #333;
      color: #f0f0f0;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      margin-left: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-arrow:hover { background-color: #555; }

    /* Modal styling - Hogwarts theme */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-content {
      background: #fdf5e6; /* parchment */
      color: #2b2b2b;
      border: 3px solid gold;
      box-shadow: 0px 0px 20px rgba(255, 215, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      max-width: 90%;
      text-align: left;
    }
    #modal-content h2 {
      font-family: 'Cinzel', serif;
      margin-top: 0;
      border-bottom: 2px solid gold;
      padding-bottom: 5px;
    }
    #modal-content ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #modal-content li {
      padding: 5px 0;
      border-bottom: 1px solid #c5a253;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #2b2b2b;
      float: right;
      cursor: pointer;
    }
  </style>
  <script>
    const points = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };

    window.onload = function() {
      fetch('https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': '$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK' }
      })
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        points['gryffindor'] = data.record.houses.Gryffindor;
        points['hufflepuff']  = data.record.houses.Hufflepuff;
        points['ravenclaw']  = data.record.houses.Ravenclaw;
        points['slytherin']  = data.record.houses.Slytherin;
        updateBars();
      })
      .catch(error => console.error('Fetch error:', error));

      // Allow ESC to close modal
      document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
          closeModal();
        }
      });
    };

    function updateBars() {
      const maxPoints = Math.max(points.gryffindor, points.hufflepuff, points.ravenclaw, points.slytherin);
      const maxBarHeight = 300;
      Object.keys(points).forEach(house => {
        const bar = document.getElementById(`${house}-bar`).firstElementChild;
        const score = document.getElementById(`${house}-score`);
        const height = maxPoints > 0 ? (points[house] / maxPoints) * maxBarHeight : 5;
        bar.style.height = height + 'px';
        score.textContent = points[house];
      });
    }

    function addPoints(house, pointsToAdd) {
      points[house] += pointsToAdd;
      points[house] = Math.max(0, points[house]);
      updateBars();

      const controls = [
        'G-10', 'G+10', 'G+50',
        'H-10', 'H+10', 'H+50',
        'R-10', 'R+10', 'R+50',
        'S-10', 'S+10', 'S+50'
      ].map(id => document.getElementById(id));

      controls.forEach(btn => btn.disabled = true);

      let req = new XMLHttpRequest();
      req.onreadystatechange = () => {
        if (req.readyState == XMLHttpRequest.DONE) {
          controls.forEach(btn => btn.disabled = false);
        }
      };

      req.open("PUT", "https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d", true);
      req.setRequestHeader("Content-Type", "application/json");
      req.setRequestHeader("X-Master-Key", "$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK");
      req.send(JSON.stringify({
        houses: {
          Gryffindor: points.gryffindor,
          Hufflepuff: points.hufflepuff,
          Ravenclaw: points.ravenclaw,
          Slytherin: points.slytherin
        }
      }));
    }

    function showStudentView() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
    function showLeaderLogin() {
      document.getElementById('leader-login').style.display = 'flex';
    }
    function checkPassword() {
      if (document.getElementById('password').value === 'Sock') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('leader-controls').style.display = 'flex';
        document.getElementById('reset-button').style.display = 'block';
      } else {
        document.getElementById('error-message').style.display = 'block';
      }
    }
    function showResetConfirmation() {
      document.getElementById('reset-button').innerHTML =
        `<button onclick="resetPoints()">Are you Certain?</button>`;
    }
    function resetPoints() {
      points.gryffindor = points.hufflepuff = points.ravenclaw = points.slytherin = 0;
      updateBars();
      const req = new XMLHttpRequest();
      req.open("PUT", "https://api.jsonbin.io/v3/b/66e2088fe41b4d34e42dc83d", true);
      req.setRequestHeader("Content-Type", "application/json");
      req.setRequestHeader("X-Master-Key", "$2a$10$uhtnjcWgpl1Vc8HIYoeWN.8gXuKAmmlF5L6sC39lRGxF9djITQpLK");
      req.send(JSON.stringify({ houses: { Gryffindor: 0, Hufflepuff: 0, Ravenclaw: 0, Slytherin: 0 } }));
      alert("Points have been reset!");
      document.getElementById('reset-button').innerHTML =
        `<button onclick="showResetConfirmation()">Reset</button>`;
    }

    function showHouseMembers(house) {
      const members = {
        gryffindor: ["Emily Reynolds", "Matthew Harper", "Josh Harris", "Jade Lewis", "Mackenzie Alliston", "Olivia Hines", "Emma Hunt"],
        hufflepuff: ["Paige Parkin", "Lois Lawes", "Sarah Hales", "Isabelle Unlu-O'Neil", "Louis Kirby", "Sam Southcott", "Tadgh Daly"],
        ravenclaw: ["Tracy Freeman", "Amy Cornish", "Hayley Reynolds", "Ruby Lee Start", "Cadance Agnew", "Oliver Clutterbuck", "Olivia Wyre", "Grace Fletcher"],
        slytherin: ["Nicola Foskett", "Yasmin Nixon", "Alison Wicks", "Rhys Foot", "Tim Balog", "India Watson"]
      };

      document.getElementById('modal-content').innerHTML =
        `<button class="close-btn" onclick="closeModal()">×</button>
         <h2>${house.charAt(0).toUpperCase() + house.slice(1)} Members</h2>
         <ul>${members[house].map(name => `<li>${name}</li>`).join('')}</ul>`;

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }
  </script>
</head>
<body>

  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-options">
      <button onclick="showStudentView()">Student</button>
      <span class="or-text">or</span>
      <button onclick="showLeaderLogin()">House Leader</button>
    </div>
    <div id="leader-login" class="password-container" style="display: none;">
      <input type="password" id="password" class="password-input" placeholder="Password">
      <button class="login-arrow" onclick="checkPassword()">→</button>
      <p id="error-message" style="color: red; display: none;">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <div class="bar-container">
      <div class="house" onclick="showHouseMembers('gryffindor')">
        <img src="https://i.imgur.com/yEJLaKM_d.webp" alt="Gryffindor Crest">
        <div class="score" id="gryffindor-score">0</div>
        <div class="bar" id="gryffindor-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('hufflepuff')">
        <img src="https://i.imgur.com/3fPEBby_d.webp" alt="Hufflepuff Crest">
        <div class="score" id="hufflepuff-score">0</div>
        <div class="bar" id="hufflepuff-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('ravenclaw')">
        <img src="https://i.imgur.com/q2ZDGMS_d.webp" alt="Ravenclaw Crest">
        <div class="score" id="ravenclaw-score">0</div>
        <div class="bar" id="ravenclaw-bar"><div></div></div>
      </div>
      <div class="house" onclick="showHouseMembers('slytherin')">
        <img src="https://i.imgur.com/TqEV4ii_d.webp" alt="Slytherin Crest">
        <div class="score" id="slytherin-score">0</div>
        <div class="bar" id="slytherin-bar"><div></div></div>
      </div>
    </div>

    <!-- Leader Controls -->
    <div id="leader-controls" class="controls">
      <div class="house-controls">
        <div class="small-buttons">
          <button id="G-10" onclick="addPoints('gryffindor', -10)">-</button>
          <button id="G+10" onclick="addPoints('gryffindor', 10)">+</button>
        </div>
        <button id="G+50" class="wide-button" onclick="addPoints('gryffindor', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="H-10" onclick="addPoints('hufflepuff', -10)">-</button>
          <button id="H+10" onclick="addPoints('hufflepuff', 10)">+</button>
        </div>
        <button id="H+50" class="wide-button" onclick="addPoints('hufflepuff', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="R-10" onclick="addPoints('ravenclaw', -10)">-</button>
          <button id="R+10" onclick="addPoints('ravenclaw', 10)">+</button>
        </div>
        <button id="R+50" class="wide-button" onclick="addPoints('ravenclaw', 50)">+50</button>
      </div>
      <div class="house-controls">
        <div class="small-buttons">
          <button id="S-10" onclick="addPoints('slytherin', -10)">-</button>
          <button id="S+10" onclick="addPoints('slytherin', 10)">+</button>
        </div>
        <button id="S+50" class="wide-button" onclick="addPoints('slytherin',
